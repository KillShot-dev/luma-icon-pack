plugins {
    id 'com.android.application'
}

android {
    namespace 'com.metaphasicgroup.luma'
    compileSdk 36
    buildToolsVersion "35.0.0"
    defaultConfig {
        applicationId 'com.metaphasicgroup.luma'
        minSdk 26
        targetSdk 36
        versionCode 7
        versionName '1.0.3'
    }

    signingConfigs {
        release {
            if (project.hasProperty('lumaStoreFile')) {
                storeFile file(lumaStoreFile)
                storePassword lumaStorePassword
                keyAlias lumaKeyAlias
                keyPassword lumaKeyPassword
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }

    flavorDimensions += 'set'
    productFlavors {
        regular { dimension 'set'; applicationIdSuffix '.regular' }
        dark { dimension 'set'; applicationIdSuffix '.dark' }
        gradient { dimension 'set'; applicationIdSuffix '.gradient' }
        glyph { dimension 'set'; applicationIdSuffix '.glyph' }
        clear { dimension 'set'; applicationIdSuffix '.clear' }
        prism { dimension 'set'; applicationIdSuffix '.prism' }
        midnight { dimension 'set'; applicationIdSuffix '.midnight' }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}

// kotlin-stdlib 1.8.22 (via AppCompat) already contains the jdk7/jdk8
// split artifacts; an older transitive edge still pulls kotlin-stdlib-jdk7
// and kotlin-stdlib-jdk8 1.6.21, whose classes duplicate stdlib's. Exclude
// the legacy split artifacts — the standard fix for this duplicate-class
// failure — rather than downgrading stdlib.
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

// Copy lint (MP-021): a release build must never ship prototype or
// phase language. Scans the app sources (Java + XML, including the
// manifest and appfilter files) and fails the build on any hit.
tasks.register('lumaCopyLint') {
    doLast {
        def bad = []
        def pattern = ~/PROTOTYPE|[Pp]hase[-\s]?\d|TODO|not yet tested/
        fileTree(dir: 'src', includes: ['**/*.java', '**/*.xml']).each { f ->
            f.eachLine('UTF-8') { line, n ->
                if (line =~ pattern) bad << "${f.path}:${n}: ${line.trim()}"
            }
        }
        if (!bad.empty) {
            throw new GradleException('Luma copy lint failed:\n' + bad.join('\n'))
        }
    }
}
// Gate every build (MP-106): configureEach reaches tasks no
// matter when AGP registers them, unlike the old whenTaskAdded
// hook, which was registered after preBuild already existed and
// so never attached. preBuild and every variant pre<Variant>Build
// anchor both the assemble and bundle graphs.
tasks.configureEach { t ->
    if (t.name == 'preBuild' || (t.name.startsWith('pre') && t.name.endsWith('Build'))) {
        t.dependsOn 'lumaCopyLint'
    }
}
