plugins {
    id 'com.android.application'
}

android {
    namespace 'com.metaphasicgroup.luma'
    compileSdk 36
    buildToolsVersion "35.0.0"
    defaultConfig {
        applicationId 'com.metaphasicgroup.luma'
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName '1.0.2'
    }

    signingConfigs {
        release {
            if (project.hasProperty('lumaStoreFile')) {
                storeFile file(lumaStoreFile)
                storePassword lumaStorePassword
                keyAlias lumaKeyAlias
                keyPassword lumaKeyPassword
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }

    flavorDimensions += 'set'
    productFlavors {
        regular { dimension 'set'; applicationIdSuffix '.regular' }
        dark { dimension 'set'; applicationIdSuffix '.dark' }
        gradient { dimension 'set'; applicationIdSuffix '.gradient' }
        glyph { dimension 'set'; applicationIdSuffix '.glyph' }
        clear { dimension 'set'; applicationIdSuffix '.clear' }
        prism { dimension 'set'; applicationIdSuffix '.prism' }
        midnight { dimension 'set'; applicationIdSuffix '.midnight' }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}

// kotlin-stdlib 1.8.22 (via AppCompat) already contains the jdk7/jdk8
// split artifacts; an older transitive edge still pulls kotlin-stdlib-jdk7
// and kotlin-stdlib-jdk8 1.6.21, whose classes duplicate stdlib's. Exclude
// the legacy split artifacts — the standard fix for this duplicate-class
// failure — rather than downgrading stdlib.
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
